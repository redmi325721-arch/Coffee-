<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านกาแฟทั่วโลก</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f0;--card:#fff;--tx:#5a3e36;--ac:#f4a6a6;--ac2:#ffd9c9;--mut:#a68a80;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1816;--card:#2a2320;--tx:#f0e4de;--ac:#d98a8a;--ac2:#3b2e2a;--mut:#a89690}}
:root[data-theme=dark]{--bg:#1c1816;--card:#2a2320;--tx:#f0e4de;--ac:#d98a8a;--ac2:#3b2e2a;--mut:#a89690}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Mali',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ac2);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--card);border-radius:12px;padding:8px 12px}
h1{font-size:18px;margin:0;flex:1}
#side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--card);transform:translateX(-100%);transition:.25s;z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px;box-shadow:2px 0 12px #0003}
#side.open{transform:none}
#side button{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--ac2)}
#side button.on{background:var(--ac)}
#veil{position:fixed;inset:0;background:#0005;z-index:15;display:none}#veil.open{display:block}
main{max-width:760px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tabs button{white-space:nowrap;background:var(--ac2)}.tabs button.on{background:var(--ac)}
.shop{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;display:flex;gap:12px}
.n{min-width:30px;height:30px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:600}
.shop h3{margin:0 0 2px;font-size:16px}.shop small{color:var(--mut)}.shop p{margin:6px 0;font-size:14px;line-height:1.5}
a.map{color:var(--tx);background:var(--ac2);padding:4px 10px;border-radius:10px;text-decoration:none;font-size:13px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0}
.tier{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:600;background:var(--ac)}
.row span.t{flex:1;font-size:14px}.row small{color:var(--mut);display:block}
input{font:inherit;color:inherit;background:var(--card);border:2px solid var(--ac2);border-radius:10px;padding:8px;width:100%;margin:4px 0}
.lg{margin-top:auto;padding-bottom:env(safe-area-inset-bottom,0px)}.lg b{display:block;font-size:13px;margin-bottom:6px;color:var(--mut)}#side .lg button.cur{background:var(--ac)}
.hide{display:none}
</style></head><body>
<header><button onclick="side(1)" aria-label="เมนู">☰</button><h1 id="ttl">☕ ร้านกาแฟทั่วโลก</h1><button id="th" onclick="theme()">🌙</button></header>
<div id="veil" onclick="side(0)"></div>
<nav id="side">
<button id="n1" data-p="shops" onclick="go('shops')">☕ ร้านกาแฟ</button>
<button id="n2" data-p="pair" onclick="go('pair')">🥐 ของกินคู่กับกาแฟ</button>
<button id="n3" data-p="vote" onclick="go('vote')">🗳️ ชาวเว็บจัดเอง + โหวต</button>
<div class="lg"><b>🌐 Change language</b><button onclick="setL('th')" data-l="th">ไทย</button><button onclick="setL('en')" data-l="en">English</button><button onclick="setL('ru')" data-l="ru">Русский</button><button onclick="setL('zh')" data-l="zh">中文</button></div></nav>
<main>
<section id="shops"><div class="tabs" id="tabs"></div><div id="list"></div></section>
<section id="pair" class="hide"><p id="pi">จัดเทียร์ของกินที่เข้ากับกาแฟ (S = เข้าสุด)</p><div id="pl"></div></section>
<section id="vote" class="hide"><p id="vi">ใครอยากแนะนำคู่ไหน พิมพ์เลย แล้วกดโหวตอันที่ชอบ</p>
<input id="vc" placeholder="กาแฟ เช่น ลาเต้"><input id="vf" placeholder="ของกิน เช่น บราวนี่">
<button id="ad" onclick="add()" style="margin:6px 0 12px;background:var(--ac)">เพิ่ม</button><div id="vl"></div></section>
</main>

let V=[];try{V=JSON.parse(localStorage.getItem('v')||'null')||[]}catch(e){}

function add(){const c=$('vc').value.trim(),f=$('vf').value.trim();if(!c||!f)return;V.push([c,f,1]);$('vc').value=$('vf').value='';save();vote()}
